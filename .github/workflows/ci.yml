name: Checks and packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Python 3.13.7 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up supported Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Initialize diagnostics
        run: python -c "from pathlib import Path; Path('ci-reports').mkdir(exist_ok=True)"
      - name: Install locked runtime, test and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt --log ci-reports/install.log
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Verify actual archive resources and evidence hashes
        run: python scripts/verify_distribution.py dist > ci-reports/distribution.json
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', glob.glob('dist/*.whl')[0]], check=True)"
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Import installed package in isolated mode
        run: python -I -c "import materialsense, materialsense.cli; print(materialsense.__version__, materialsense.__file__)"
      - name: Lint source
        run: python -m ruff check .
      - name: Run offline synthetic tests with failure report
        run: python -m pytest -q --junitxml=ci-reports/pytest.xml
      - name: Verify retained result snapshot
        run: python scripts/verify_results.py reports/benchmark-10
      - name: Smoke-test installed CLI
        run: python -I -m materialsense.cli --help
      - name: Save installed environment even after a failure
        if: ${{ always() && steps.python.outcome == 'success' }}
        run: python -m pip freeze > ci-reports/environment.txt
      - name: Retain test, installation and packaging diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.os }}-py3137
          path: |
            ci-reports/
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
